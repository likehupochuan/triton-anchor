name: Dispatch Local CI via Gitee

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      source_branch:
        description: "GitHub branch represented by this local CI task"
        required: false
        default: ""
        type: string
      commit_sha:
        description: "Commit SHA to test; defaults to the workflow commit"
        required: false
        default: ""
        type: string
      flaggems_mode:
        description: "FlagGems mode for manual dispatch"
        required: false
        default: "sample"
        type: choice
        options:
          - sample
          - full
  workflow_call:
    inputs:
      pr_number:
        description: "Validated pull request number"
        required: true
        type: string
      head_sha:
        description: "Validated pull request head SHA"
        required: true
        type: string
      base_sha:
        description: "Validated pull request base SHA"
        required: true
        type: string
      base_ref:
        description: "Validated pull request base branch"
        required: true
        type: string
      head_repo:
        description: "Validated pull request head repository"
        required: true
        type: string
      head_ref:
        description: "Validated pull request head branch"
        required: true
        type: string
      run_title:
        description: "Sanitized workflow run title"
        required: false
        default: ""
        type: string
    secrets:
      GITEE_TOKEN:
        required: true

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: dispatch-local-ci-${{ github.event_name }}-${{ inputs.pr_number || github.ref_name || inputs.source_branch }}-${{ inputs.flaggems_mode || 'sample' }}
  cancel-in-progress: true

jobs:
  dispatch-local-ci:
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTEXT: ${{ vars.LOCAL_CI_CONTEXT || 'local-ci/sophgo-cmodel' }}
      GITEE_CI_OWNER: ${{ vars.GITEE_RESULTS_OWNER || vars.GITEE_OWNER || 'race-org' }}
      GITEE_CI_REPO: ${{ vars.GITEE_RESULTS_REPO || 'triton-anchor-local-ci-results' }}
      GITEE_CI_REPO_URL: ${{ vars.GITEE_RESULTS_REPO_URL }}
      GITEE_CI_WEB_URL: ${{ vars.GITEE_RESULTS_WEB_URL || 'https://gitee.com/race-org/triton-anchor-local-ci-results' }}
      GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'likehupochuan' }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GATEWAY_CONTRACT_VERSION: "1"
      GATEWAY_REF: ${{ github.ref_name }}
      RECEIVER_WAIT_SECONDS: ${{ vars.LOCAL_CI_RECEIVER_WAIT_SECONDS || '20400' }}

    steps:
      - name: Resolve task metadata
        id: meta
        env:
          EVENT_SHA: ${{ inputs.head_sha || inputs.commit_sha || github.sha }}
          EVENT_BASE_SHA: ${{ inputs.base_sha }}
          EVENT_BASE_BRANCH: ${{ inputs.base_ref }}
          EVENT_SOURCE_BRANCH: ${{ inputs.head_ref || inputs.source_branch || github.ref_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_REPO: ${{ inputs.head_repo }}
          REQUESTED_FLAGGEMS_MODE: ${{ inputs.flaggems_mode || 'sample' }}
        run: |
          set -euo pipefail

          flaggems_mode="sample"
          if [ -z "${PR_NUMBER}" ] && [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            flaggems_mode="${REQUESTED_FLAGGEMS_MODE:-sample}"
          fi
          case "${flaggems_mode}" in
            sample|full) ;;
            *)
              echo "::error::Unsupported FlagGems mode: ${flaggems_mode}"
              exit 1
              ;;
          esac

          context="${CONTEXT}"
          if [ -n "${PR_NUMBER}" ]; then
            task_ref="ci/pr-${PR_NUMBER}/${EVENT_SOURCE_BRANCH}"
            base_task_ref="ci/base/pr-${PR_NUMBER}/${EVENT_SOURCE_BRANCH}"
            base_fetch_ref="refs/heads/${EVENT_BASE_BRANCH}"
          elif [ "${flaggems_mode}" = "full" ]; then
            task_ref="ci/full/${EVENT_SOURCE_BRANCH}"
            base_task_ref=""
            base_fetch_ref=""
            context="${CONTEXT}/full"
          else
            task_ref="ci/push/${EVENT_SOURCE_BRANCH}"
            base_task_ref=""
            base_fetch_ref=""
          fi

          if ! git check-ref-format "refs/heads/${task_ref}"; then
            echo "::error::Generated Gitee task ref is not a valid git branch: ${task_ref}"
            exit 1
          fi

          if [ -n "${PR_NUMBER}" ]; then
            fetch_ref="refs/pull/${PR_NUMBER}/head"
            source_label="${PR_HEAD_REPO}:${EVENT_SOURCE_BRANCH}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            fetch_ref="${GITHUB_REF}"
            source_label="${EVENT_SOURCE_BRANCH}"
          else
            fetch_ref="refs/heads/${EVENT_SOURCE_BRANCH}"
            source_label="${EVENT_SOURCE_BRANCH}"
          fi
          {
            echo "sha=${EVENT_SHA}"
            echo "base_sha=${EVENT_BASE_SHA}"
            echo "source_branch=${EVENT_SOURCE_BRANCH}"
            echo "source_label=${source_label}"
            echo "task_ref=${task_ref}"
            echo "base_task_ref=${base_task_ref}"
            echo "base_fetch_ref=${base_fetch_ref}"
            echo "fetch_ref=${fetch_ref}"
            echo "flaggems_mode=${flaggems_mode}"
            echo "context=${context}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"

      - name: Fetch and verify exact task commit
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          FETCH_REF: ${{ steps.meta.outputs.fetch_ref }}
          BASE_SHA: ${{ steps.meta.outputs.base_sha }}
          BASE_FETCH_REF: ${{ steps.meta.outputs.base_fetch_ref }}
        run: |
          set -euo pipefail

          if [[ ! "${SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Task SHA must be a full 40-character commit SHA"
            exit 1
          fi

          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

          # Gitee rejects relay updates when the pushed commit has shallow ancestry.
          git fetch --no-tags origin "+${FETCH_REF}:refs/local-ci/task"

          if [ -n "${BASE_SHA}" ]; then
            git fetch --no-tags origin "+${BASE_FETCH_REF}:refs/local-ci/base"
            actual_base_sha="$(git rev-parse refs/local-ci/base)"
            if [ "${actual_base_sha}" != "${BASE_SHA}" ]; then
              echo "::error::Fetched PR base ${actual_base_sha}, expected ${BASE_SHA}"
              exit 1
            fi
          fi

          if ! actual_sha="$(git rev-parse --verify "${SHA}^{commit}")"; then
            echo "::error::Requested task commit ${SHA} was not fetched"
            exit 1
          fi
          if [ "${actual_sha}" != "${SHA}" ]; then
            echo "::error::Fetched ${actual_sha}, expected ${SHA}"
            exit 1
          fi
          git update-ref refs/local-ci/task-selected "${actual_sha}"

      - name: Push task ref to CI relay repository
        env:
          TASK_REF: ${{ steps.meta.outputs.task_ref }}
          BASE_SHA: ${{ steps.meta.outputs.base_sha }}
          BASE_TASK_REF: ${{ steps.meta.outputs.base_task_ref }}
        run: |
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "GITEE_TOKEN is empty"
            exit 1
          fi

          GITEE_USERNAME="${GITEE_USERNAME:-${GITEE_CI_OWNER}}"
          export GITEE_USERNAME
          repo_url="${GITEE_CI_REPO_URL:-https://gitee.com/${GITEE_CI_OWNER}/${GITEE_CI_REPO}.git}"
          askpass="${RUNNER_TEMP}/gitee-askpass.sh"
          cat > "${askpass}" <<'SH'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s\n' "${GITEE_USERNAME}" ;;
            *) printf '%s\n' "${GITEE_TOKEN}" ;;
          esac
          SH
          chmod 700 "${askpass}"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote add gitee-ci "${repo_url}"
          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git push --force gitee-ci \
              "refs/local-ci/task-selected:refs/heads/${TASK_REF}"

          if [ -n "${BASE_SHA}" ] && [ -n "${BASE_TASK_REF}" ]; then
            GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
              git push --force gitee-ci "refs/local-ci/base:refs/heads/${BASE_TASK_REF}"
          fi

      - name: Mark local CI pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.meta.outputs.sha }}
          TASK_REF: ${{ steps.meta.outputs.task_ref }}
          STATUS_CONTEXT: ${{ steps.meta.outputs.context }}
          FLAGGEMS_MODE: ${{ steps.meta.outputs.flaggems_mode }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=pending \
            -f context="${STATUS_CONTEXT}" \
            -f description="local CI ${FLAGGEMS_MODE} task queued on Gitee" \
            -f target_url="${GITEE_CI_WEB_URL}/tree/${TASK_REF}"

      - name: Start result receiver
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.meta.outputs.sha }}
          SOURCE_BRANCH: ${{ steps.meta.outputs.source_branch }}
          TASK_REF: ${{ steps.meta.outputs.task_ref }}
          STARTED_AT: ${{ steps.meta.outputs.started_at }}
          STATUS_CONTEXT: ${{ steps.meta.outputs.context }}
          RUN_TITLE: ${{ inputs.run_title || github.event.head_commit.message || inputs.source_branch || github.ref_name }}
        run: |
          gh workflow run ci-gateway.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GATEWAY_REF}" \
            -f gateway_contract_version="${GATEWAY_CONTRACT_VERSION}" \
            -f mode="receive" \
            -f sha="${SHA}" \
            -f source_branch="${SOURCE_BRANCH}" \
            -f task_ref="${TASK_REF}" \
            -f context="${STATUS_CONTEXT}" \
            -f attempt="1" \
            -f started_at="${STARTED_AT}" \
            -f wait_seconds="${RECEIVER_WAIT_SECONDS}" \
            -f run_title="${RUN_TITLE}"

      - name: Mark dispatch failure
        if: ${{ failure() && steps.meta.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.meta.outputs.sha }}
          STATUS_CONTEXT: ${{ steps.meta.outputs.context || env.CONTEXT }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=error \
            -f context="${STATUS_CONTEXT}" \
            -f description="failed to dispatch local CI task"
