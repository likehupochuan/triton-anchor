name: CI Gateway
run-name: >-
  CI v4 | ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'service' && 'service' || github.event_name == 'workflow_dispatch' && inputs.mode == 'run' && (inputs.action == 'closed' || inputs.action == 'converted_to_draft') && 'cancel' || github.event_name == 'workflow_dispatch' && inputs.mode == 'run' && 'run' || 'route' }} | ${{ (inputs.pr_number != '' && inputs.pr_number != '0' && format('PR {0}', inputs.pr_number)) || (github.event.pull_request.number && format('PR {0}', github.event.pull_request.number)) || (inputs.mode == 'service' && 'receiver') || format('branch {0}', inputs.source_branch || github.ref_name) }}
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed, converted_to_draft, labeled, unlabeled]
  push:
    branches: [main, CI_dev]
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [request, run, service]
        default: request
      pr_number: {type: string, default: '0'}
      source_branch: {type: string, default: ''}
      requested_sha: {type: string, default: ''}
      worker_revision_sha: {type: string, default: ''}
      action: {type: string, default: ''}
      full: {type: boolean, default: false}
permissions: {}
concurrency:
  group: ci-v4-${{ inputs.mode || github.event_name }}-${{ inputs.pr_number != '0' && inputs.pr_number || github.event.pull_request.number || inputs.source_branch || github.ref_name }}
  cancel-in-progress: ${{ inputs.mode != 'service' }}
jobs:
  route:
    if: >-
      github.repository == 'likehupochuan/triton-anchor' &&
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'request')
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read, actions: write}
    steps:
      - name: Route to the trusted CI_dev implementation
        uses: actions/github-script@v7
        env:
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_BRANCH: ${{ inputs.source_branch }}
          INPUT_SHA: ${{ inputs.requested_sha }}
          INPUT_FULL: ${{ inputs.full }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const pull = context.payload.pull_request;
            if (pull?.base.ref === 'CI_dev_forPR') return;
            const branch = process.env.INPUT_BRANCH || (pull?.base.ref || context.ref.replace('refs/heads/', ''));
            if (branch === 'CI_dev_forPR') throw new Error('Excluded target branch');
            if (context.eventName === 'push') {
              const {data: pulls} = await github.rest.pulls.list({owner, repo, state:'open', head:owner+':'+branch, per_page:100});
              if (pulls.some(pr => !pr.draft && pr.head.sha === context.sha && pr.base.ref !== 'CI_dev_forPR')) {
                core.info('The ready PR event owns this revision; avoid a duplicate branch task.');
                return;
              }
            }
            const {data: worker} = await github.rest.repos.getBranch({owner, repo, branch: 'CI_dev'});
            const revision = worker.commit.sha;
            const {data: file} = await github.rest.repos.getContent({owner, repo, path: '.github/ci-gateway-manifest.json', ref: revision});
            const manifest = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            if (manifest.gateway_contract_version !== '4') throw new Error('Deploy CI_dev v4 before the router');
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'ci-gateway.yml', ref: 'CI_dev',
              inputs: {
                mode: context.eventName === 'schedule' ? 'service' : 'run',
                pr_number: String(pull?.number || process.env.INPUT_PR || '0'),
                source_branch: branch,
                requested_sha: pull?.head.sha || process.env.INPUT_SHA || (context.eventName === 'push' ? context.sha : ''),
                worker_revision_sha: revision, action: context.eventName === 'workflow_dispatch' ? 'manual' : context.payload.action || '',
                full: process.env.INPUT_FULL || 'false'
              }
            });
