name: CI Gateway
run-name: >-
  ${{ inputs.run_title || (inputs.pr_number != '' && inputs.pr_number != '0' && format('PR #{0}', inputs.pr_number)) || format('Branch {0}', inputs.source_branch || github.ref_name) }} | dispatch
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [run]
        default: run
      pr_number: {type: string, default: '0'}
      source_branch: {type: string, default: ''}
      requested_sha: {type: string, default: ''}
      worker_revision_sha: {type: string, default: ''}
      action: {type: string, default: ''}
      full: {type: boolean, default: false}
      run_title: {type: string, default: '', description: 'Display identity passed between stages; normally leave empty'}
permissions: {}
concurrency:
  group: ${{ format('local-ci-run-{0}', inputs.pr_number != '0' && inputs.pr_number || inputs.source_branch || github.ref_name) }}
  cancel-in-progress: true
jobs:
  cancel-obsolete:
    name: Cancel obsolete tasks
    needs: validate-worker
    if: needs.validate-worker.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, statuses: write, checks: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.worker_revision_sha }}
          persist-credentials: false
          submodules: false
      - name: Notify local workers about obsolete tasks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_BRANCH: ${{ inputs.source_branch || github.ref_name }}
          GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'likehupochuan' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_RESULTS_REPO_URL: ${{ vars.GITEE_RESULTS_REPO_URL }}
        run: python3 scripts/ci/gateway.py cancel
  prepare:
    name: Prepare exact task
    needs: cancel-obsolete
    if: ${{ inputs.action != 'closed' && inputs.action != 'converted_to_draft' }}
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, statuses: write, checks: write, actions: read}
    outputs:
      task_id: ${{ steps.task.outputs.task_id }}
      task_digest: ${{ steps.task.outputs.task_digest }}
      tested_sha: ${{ steps.task.outputs.tested_sha }}
      head_sha: ${{ steps.task.outputs.head_sha }}
      base_sha: ${{ steps.task.outputs.base_sha }}
      external_fork: ${{ steps.task.outputs.external_fork }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.worker_revision_sha }}
          persist-credentials: false
          submodules: false
      - name: Freeze exact task and candidate LLVM
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_SHA: ${{ github.event_name == 'push' && github.sha || inputs.worker_revision_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_BRANCH: ${{ inputs.source_branch || github.ref_name }}
          REQUESTED_SHA: ${{ inputs.requested_sha || (github.event_name == 'push' && github.sha) || '' }}
          FULL: ${{ inputs.full }}
          GITEE_SUBMODULE_MIRRORS: ${{ vars.GITEE_SUBMODULE_MIRRORS || '{}' }}
          EVENT_KIND: ${{ inputs.action == 'manual' && 'manual' || 'push' }}
        run: python3 scripts/ci/gateway.py prepare
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.task.outputs.task_id != '' }}
        with: {name: 'local-ci-task-${{ steps.task.outputs.task_digest }}', path: task.json}
      - name: Validate required PR information
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/gateway.py info
  basic:
    name: Basic CI
    needs: prepare
    permissions: {contents: read}
    uses: ./.github/workflows/local-ci-basic-checks.yml
    with:
      tested_sha: ${{ needs.prepare.outputs.tested_sha }}
  api:
    name: API compatibility
    needs: [prepare, basic]
    permissions: {contents: read}
    uses: ./.github/workflows/local-ci-api-compatibility.yml
    with:
      task_digest: ${{ needs.prepare.outputs.task_digest }}
      tested_sha: ${{ needs.prepare.outputs.tested_sha }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      worker_revision_sha: ${{ github.event_name == 'push' && github.sha || inputs.worker_revision_sha }}
  security:
    name: Security gate
    needs: [prepare, api]
    permissions: {contents: read, security-events: write}
    uses: ./.github/workflows/local-ci-security.yml
    with:
      task_digest: ${{ needs.prepare.outputs.task_digest }}
      tested_sha: ${{ needs.prepare.outputs.tested_sha }}
      worker_revision_sha: ${{ github.event_name == 'push' && github.sha || inputs.worker_revision_sha }}
  basic-result:
    name: Publish Basic CI result
    needs: [prepare, basic]
    if: ${{ always() && needs.prepare.outputs.task_id != '' }}
    permissions: {contents: read, pull-requests: read, checks: write, statuses: read, actions: read}
    uses: ./.github/workflows/local-ci-preflight-result.yml
    with:
      task_digest: ${{ needs.prepare.outputs.task_digest }}
      worker_revision_sha: ${{ github.event_name == 'push' && github.sha || inputs.worker_revision_sha }}
      stage: basic
      outcome: ${{ needs.basic.result }}
  api-result:
    name: Publish API result
    needs: [prepare, api]
    if: ${{ always() && needs.prepare.outputs.task_id != '' }}
    permissions: {contents: read, pull-requests: read, checks: write, statuses: read, actions: read}
    uses: ./.github/workflows/local-ci-preflight-result.yml
    with:
      task_digest: ${{ needs.prepare.outputs.task_digest }}
      worker_revision_sha: ${{ github.event_name == 'push' && github.sha || inputs.worker_revision_sha }}
      stage: api
      outcome: ${{ needs.api.result }}
  security-result:
    name: Publish security result
    # Keep security execution independent, but publish its result/card only
    # after the earlier result publishers have settled.
    needs: [prepare, security, basic-result, api-result]
    if: ${{ always() && needs.prepare.outputs.task_id != '' }}
    permissions: {contents: read, pull-requests: write, checks: write, statuses: read, actions: read}
    uses: ./.github/workflows/local-ci-preflight-result.yml
    with:
      task_digest: ${{ needs.prepare.outputs.task_digest }}
      worker_revision_sha: ${{ github.event_name == 'push' && github.sha || inputs.worker_revision_sha }}
      stage: security
      outcome: ${{ needs.security.result }}
      external_fork: ${{ needs.prepare.outputs.external_fork == 'true' }}
      review_card: ${{ needs.prepare.outputs.external_fork == 'true' && needs.basic-result.result == 'success' && needs.api-result.result == 'success' }}
  approve-external-fork:
    name: Approve external fork
    needs: [prepare, security-result]
    if: ${{ needs.prepare.outputs.external_fork == 'true' && needs.security-result.outputs.eligible == 'true' }}
    environment: local-ci-fork-approval
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read, actions: read, checks: write, statuses: read}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.worker_revision_sha }}
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with: {name: 'local-ci-task-${{ needs.prepare.outputs.task_digest }}'}
      - name: Verify required reviewers and the approved PR revision
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TASK_DIGEST: ${{ needs.prepare.outputs.task_digest }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: python3 scripts/ci/gateway.py approval
  enqueue:
    name: Dispatch local CI task
    needs: [prepare, basic, api, security, basic-result, api-result, security-result, approve-external-fork]
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.task_id != '' &&
      needs.basic.result == 'success' && needs.api.result == 'success' &&
      needs.security.result == 'success' &&
      needs.basic-result.result == 'success' && needs.api-result.result == 'success' &&
      needs.security-result.result == 'success' &&
      (needs.prepare.outputs.external_fork != 'true' ||
       (needs.security-result.outputs.eligible == 'true' && needs.approve-external-fork.result == 'success'))
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, statuses: write, checks: write, actions: write}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.worker_revision_sha }}
          path: trusted
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tested_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with: {name: 'local-ci-task-${{ needs.prepare.outputs.task_digest }}'}
      - name: Revalidate approval and publish code then immutable task
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_SHA: ${{ needs.prepare.outputs.head_sha }}
          EXPECTED_TASK_DIGEST: ${{ needs.prepare.outputs.task_digest }}
          GH_TOKEN: ${{ github.token }}
          GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'likehupochuan' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_RESULTS_REPO_URL: ${{ vars.GITEE_RESULTS_REPO_URL }}
        run: python3 trusted/scripts/ci/gateway.py enqueue
      - name: Start the receiver for this published task
        uses: actions/github-script@v7
        env:
          TASK_ID: ${{ needs.prepare.outputs.task_id }}
        with:
          retries: 3
          script: |
            const task = JSON.parse(require('fs').readFileSync('task.json', 'utf8'));
            const runTitle = task.pr_number
              ? `PR #${task.pr_number} | h:${task.head_sha.slice(0, 7)} m:${task.tested_sha.slice(0, 7)}`
              : `Branch ${task.target_branch} | h:${task.tested_sha.slice(0, 7)}`;
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'ci-gateway.yml', ref: 'main',
              inputs: {mode: 'receive', task_id: process.env.TASK_ID, receiver_round: '1', run_title: runTitle}
            });
  finalize-preflight:
    name: Finish interrupted checks
    needs: [prepare, basic, api, security, basic-result, api-result, security-result, approve-external-fork, enqueue]
    if: ${{ always() && needs.prepare.outputs.task_id != '' && needs.enqueue.result != 'success' }}
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, statuses: write, checks: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.worker_revision_sha }}
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@v4
        with: {name: 'local-ci-task-${{ needs.prepare.outputs.task_digest }}'}
      - name: Finish checks after failed or cancelled preflight and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TASK_DIGEST: ${{ needs.prepare.outputs.task_digest }}
          STAGES: '{"prepare":"${{ needs.prepare.result }}","basic":"${{ needs.basic.result }}","api":"${{ needs.api.result }}","security":"${{ needs.security.result }}","card":"${{ needs.security-result.outputs.card_result }}","approval":"${{ needs.approve-external-fork.result }}","enqueue":"${{ needs.enqueue.result }}"}'
        run: python3 scripts/ci/gateway.py finalize
  validate-worker:
    name: Validate control revision
    if: >-
      (github.repository == 'likehupochuan/triton-anchor' || github.repository == 'anteloper-c/triton-anchor') &&
      github.ref_name == 'local-ci-unified' &&
      ((github.event_name == 'workflow_dispatch' && inputs.mode == 'run') ||
       (github.event_name == 'push' && !github.event.deleted))
    runs-on: ubuntu-latest
    permissions: {pull-requests: read}
    outputs:
      proceed: ${{ github.event_name != 'push' || steps.pr.outputs.proceed == 'true' }}
    steps:
      - name: Require the routed trusted worker revision
        env:
          WORKER_SHA: ${{ github.event_name == 'push' && github.sha || inputs.worker_revision_sha }}
        run: |
          test "$GITHUB_REF_NAME" = local-ci-unified
          test "$GITHUB_SHA" = "$WORKER_SHA"
      - name: Let an existing ready PR own this push
        id: pr
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const {data: pulls} = await github.rest.pulls.list({owner, repo, state:'open', head:owner+':'+branch, per_page:100});
            const duplicate = pulls.some(pr => !pr.draft && pr.head.sha === context.sha);
            if (duplicate) core.info('The ready PR event owns this revision; avoid a duplicate branch task.');
            core.setOutput('proceed', !duplicate);
